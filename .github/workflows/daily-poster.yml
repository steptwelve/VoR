name: Daily Meditation Poster

# ─────────────────────────────────────────────────────────────────────────────
# VoR Daily Meditation — GitHub Actions Workflow
# Version: 2026-10-13.16
#
# Changes in .16 (2026-10-13):
# - Optional X native-video posting (repo variable X_VIDEO == 'true'):
#   Step 1 defers X (DEFER_X=1); Step 5b posts the Short to X via Buffer,
#   hosted on the 'x-media' release, falling back to the image post when
#   the Short is missing, over 2:20, or fails in Buffer.
#
# Changes in .15 (2026-10-13):
# - Added an English YouTube Short (Step 4b): build_short.py renders a
#   1080x1920 version with burned-in captions; upload_youtube.py uploads it
#   with VOR_FORMAT=short. Off unless repo variable ENABLE_SHORTS == 'true'.
#   Over-3:00 days are skipped with a Pushover warning (never truncated).
#
# Changes in .14 (2026-10-12):
# - Fixed every step check to use steps.<id>.outcome instead of .conclusion.
#   With continue-on-error: true, a failed step has outcome='failure' but
#   conclusion='success', so the .11 change made failures invisible: failure
#   Pushovers never fired, uploads ran after failed builds, and the
#   "Daily run complete" success Pushover fired anyway (10-12 edge-tts 403).
#   Downstream steps now only run if the upstream step really succeeded.
# - edge-tts installed from pinned upstream PR #491 (temporary, approved by
#   Jackson) — Microsoft's legacy TTS host returns 403 since 2026-10-10.
#
# Changes in .13 (2026-08-04):
# - X/Twitter posting now goes through Buffer instead of the X API directly.
#   daily_poster.py's post_to_x() was rewritten to call Buffer's GraphQL API
#   (createPost mutation), with the daily PNG uploaded to imgbb.com first to
#   get a public URL for Buffer's image asset input (Buffer doesn't accept
#   raw file uploads). Removed X_API_KEY / X_API_SECRET / X_ACCESS_TOKEN /
#   X_ACCESS_TOKEN_SECRET env vars from the social step; added BUFFER_API_KEY
#   and IMGBB_API_KEY.
#
# Changes in .12 (2026-05-18):
# - Fixed success notification firing even when social posting (Bluesky/X)
#   failed. steps.social was never checked in the success condition, so a
#   Bluesky 403 (or any social step failure) would still produce a false
#   "Daily run complete" Pushover. Added steps.social.conclusion != 'failure'
#   to the success guard.
# - Fixed social failure notification: changed condition from
#   failure() && steps.social.outcome == 'failure' to
#   always() && steps.social.conclusion == 'failure' so it fires reliably
#   regardless of job failure state.
# - Lowered social failure notification priority from 1 (high/wake) to
#   0 (normal) — consistent with all other failure notifications.
# - Updated PUSHOVER PRIORITY LEVELS comment: priority 1 removed (no longer
#   used anywhere in the workflow).
#
# Changes in .11 (2026-03-23):
# - Fixed failure notifications never firing for continue-on-error steps.
#   When a step has continue-on-error: true, GitHub sets outcome='success'
#   even if the command exits non-zero — only conclusion='failure' tells
#   the truth. All failure notification conditions now check conclusion
#   instead of outcome. This affected the Spanish pipeline (translate, build,
#   upload), the background download, and the English video steps — all of
#   which had continue-on-error: true but were checking outcome=='failure'.
#
# Changes in .10 (2026-03-23):
# - Fixed .posted file being wiped by 'git checkout -- .' in the commit step.
#   The .posted file is written by daily_poster.py during Step 1, but before
#   it was ever staged, git checkout -- . discarded it, so it was never
#   committed and the duplicate guard never fired on subsequent runs.
#   Fix: save meditations/MM-DD.posted to /tmp before git checkout, then
#   restore it after git pull --rebase — same pattern used for .vor-state.json.
#
# Changes in .09 (2026-03-22):
# - Fixed last_video_idx never advancing. git stash pop was silently failing
#   on conflict with .vor-state.json (stash pop || true), leaving the remote
#   stale version on disk. Voice advanced (last_voice_idx) but video index
#   stayed at 0 every run. Fix: copy .vor-state.json to /tmp before git ops,
#   restore it after pull --rebase, bypassing stash entirely for state files.
#
# Changes in .08 (2026-03-22):
# - Fixed second rebase failure in commit step. build-video.sh gets chmod +x
#   during the run, leaving it as an unstaged change that blocks the post-commit
#   rebase. Fix: restore build-video.sh to its committed state (discarding the
#   mode-only change) before the rebase+push block.
#
# Changes in .07 (2026-03-15):
# - Added chmod +x build-video.sh before running it. Filesystem tool writes
#   strip executable bits, so the script loses +x on each commit.
# - Added git stash before git pull --rebase in commit step to handle
#   unstaged changes (e.g. .vor-state.json written mid-run) that blocked rebase.
#
# Changes in .06 (2026-03-15):
# - Removed .vor-state.json from .gitignore so rotation state persists
#   across GitHub Actions runner instances.
# - Changed git add .vor-state.json to git add -f .vor-state.json in the
#   commit step as belt-and-suspenders (prevents gitignore warnings that
#   were causing the commit step to silently skip .posted files).
#
# Changes in .05 (2026-03-11):
# - Added meditations/*.posted to the commit step git add command.
#
# Changes in .04 (2026-03-11):
# - Fixed commit step: replaced 'git add --ignore-missing' with shell
#   conditional for .vor-state.json (git 2.53 compatibility).
#
# Changes in .03 (2026-03-11):
# - Attempted --ignore-missing fix — did not work on runner git 2.53.0.
#
# Changes in .02 (2026-03-11):
# - Replaced config.yml video flag check with GitHub Actions Variables.
# - Added Pushover notifications on any step failure.
# - Added soft Pushover warning for Pexels 404 fallback.
# - Isolated video pipeline with continue-on-error.
# - Commit step always runs via if: always().
#
# Changes in .01 (original):
# - Initial workflow.
#
# ─────────────────────────────────────────────────────────────────────────────
#
# GITHUB ACTIONS VARIABLES (Settings → Secrets and variables → Variables):
#   ENABLE_VIDEO    — set to 'true' to enable video build + YouTube upload
#   ENABLE_SPANISH  — set to 'true' to enable Spanish translation + video
#                     (only takes effect when ENABLE_VIDEO is also 'true')
#
# GITHUB SECRETS REQUIRED (Settings → Secrets and variables → Secrets):
#   BSKY_USERNAME, BSKY_APP_PASSWORD       — Bluesky credentials
#   BUFFER_API_KEY                         — Buffer personal API key (X posting)
#   IMGBB_API_KEY                          — imgbb.com API key (public image
#                                             URL for Buffer's X image asset)
#   PEXELS_API_KEY                         — Pexels API key for backgrounds
#   ANTHROPIC_API_KEY                      — Anthropic API (Spanish translation)
#   YT_TOKEN_JSON                          — YouTube OAuth token (English channel)
#   YT_TOKEN_JSON_ES                       — YouTube OAuth token (Spanish channel)
#   PUSHOVER_USER_KEY                      — Pushover user key
#   PUSHOVER_APP_TOKEN                     — Pushover app token for VoR
#
# PUSHOVER PRIORITY LEVELS USED:
#   -1  Quiet          — Daily success notification
#    0  Normal         — Any step failure needing investigation
#
# NOTE ON continue-on-error AND NOTIFICATIONS:
#   Steps with continue-on-error: true always show conclusion='success' even
#   when the command fails. Only outcome='failure' reflects the real exit
#   code. All step checks (gating and notifications) use outcome, not
#   conclusion. (The .11 note below had this backwards — fixed 2026-10-12.)
#
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Runs at 1 AM Pacific (9 AM UTC)
    - cron: '0 9 * * *'

  # Allows manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  post-meditation:
    runs-on: ubuntu-latest

    steps:

      # ── Setup ────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Step 1: Scrape meditation text + post to Bluesky and X ───────────────
      #
      # daily_poster.py checks for meditations/MM-DD.posted before posting.
      # If found, exits 0 cleanly — prevents duplicates on manual re-runs.
      #
      # X posting goes through Buffer (BUFFER_API_KEY) rather than the X API
      # directly. The daily image is uploaded to imgbb (IMGBB_API_KEY) first
      # to get a public URL for Buffer's image asset input.
      #
      - name: Scrape meditation and post to Bluesky + X
        id: social
        env:
          BSKY_USERNAME: ${{ secrets.BSKY_USERNAME }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          # X_VIDEO: X is posted later (Step 5b) with the Short as native video
          DEFER_X: ${{ vars.X_VIDEO == 'true' && '1' || '' }}
        run: |
          python daily_poster.py

      - name: Notify — Step 1 failure (scrape or social post failure)
        if: always() && steps.social.outcome == 'failure'
        run: |
          curl -s \
            --form-string "token=${{ secrets.PUSHOVER_APP_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER_KEY }}" \
            --form-string "title=VoR FAILURE: Social post" \
            --form-string "message=Daily meditation scrape or social posting failed on $(date +'%m-%d'). Check GitHub Actions logs." \
            --form-string "priority=0" \
            https://api.pushover.net/1/messages.json

      # ── Step 2: Download background video from Pexels ────────────────────────
      - name: Download background video from Pexels
        id: background
        if: vars.ENABLE_VIDEO == 'true'
        continue-on-error: true
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python download_background.py --output /tmp/background.mp4

      - name: Notify — Pexels video skipped (soft warning)
        if: vars.ENABLE_VIDEO == 'true' && steps.background.outcome == 'success'
        run: |
          if [ -f /tmp/pexels_warning.txt ]; then
            MSG=$(cat /tmp/pexels_warning.txt)
            curl -s \
              --form-string "token=${{ secrets.PUSHOVER_APP_TOKEN }}" \
              --form-string "user=${{ secrets.PUSHOVER_USER_KEY }}" \
              --form-string "title=VoR Warning: Pexels video skipped" \
              --form-string "message=${MSG}" \
              --form-string "priority=-1" \
              https://api.pushover.net/1/messages.json
          fi

      - name: Notify — background download failed
        if: vars.ENABLE_VIDEO == 'true' && steps.background.outcome == 'failure'
        run: |
          curl -s \
            --form-string "token=${{ secrets.PUSHOVER_APP_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER_KEY }}" \
            --form-string "title=VoR FAILURE: Background video" \
            --form-string "message=All Pexels video IDs failed on $(date +'%m-%d'). No video built today. Check backgrounds.txt." \
            --form-string "priority=0" \
            https://api.pushover.net/1/messages.json

      # ── Step 3: Install video dependencies ───────────────────────────────────
      - name: Install video dependencies (ffmpeg + edge-tts)
        if: vars.ENABLE_VIDEO == 'true' && steps.background.outcome == 'success'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation
          pip install pillow
          # TEMPORARY (2026-10-12): Microsoft's legacy Read Aloud host returns
          # 403 since 2026-10-10 for every edge-tts release (upstream issue
          # rany2/edge-tts#490). PR #491 moves synthesis to
          # api.msedgeservices.com. Pinned to the reviewed PR commit until a
          # fixed release ships, then go back to a plain `pip install edge-tts`.
          pip install --force-reinstall --no-deps \
            "git+https://github.com/jonata/edge-tts@8a5844c3a1d33e4e8f2f3e14535542c0d75d4248"
          python -c "import edge_tts.constants as c; assert 'msedgeservices' in c.WSS_URL, c.WSS_URL; print('edge-tts endpoint OK')"

      # ── Step 4: Build and upload English video to YouTube ────────────────────
      - name: Build English video
        id: build_en
        if: vars.ENABLE_VIDEO == 'true' && steps.background.outcome == 'success'
        continue-on-error: true
        run: |
          chmod +x build-video.sh
          MMDD=$(date +'%m-%d')
          YEAR=$(date +'%Y')
          BACKGROUND_VIDEO=/tmp/background.mp4 ./build-video.sh $MMDD $YEAR

      - name: Upload English video to YouTube
        id: upload_en
        if: vars.ENABLE_VIDEO == 'true' && steps.build_en.outcome == 'success'
        continue-on-error: true
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          python upload_youtube.py

      - name: Notify — English video failure
        if: |
          vars.ENABLE_VIDEO == 'true' &&
          (steps.build_en.outcome == 'failure' || steps.upload_en.outcome == 'failure')
        run: |
          STAGE="build"
          if [ "${{ steps.build_en.outcome }}" == "success" ]; then STAGE="upload"; fi
          curl -s \
            --form-string "token=${{ secrets.PUSHOVER_APP_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER_KEY }}" \
            --form-string "title=VoR FAILURE: English video ${STAGE}" \
            --form-string "message=English video ${STAGE} failed on $(date +'%m-%d'). Check GitHub Actions logs." \
            --form-string "priority=0" \
            https://api.pushover.net/1/messages.json

      # ── Step 4b: English YouTube Short (vertical, captions burned in) ────────
      # Gated by repo variable ENABLE_SHORTS ('true' to turn on). Reuses the
      # same background and voice as the landscape video. build_short.py exits
      # 3 if the Short would exceed 3:00 — we skip and warn, never truncate.
      # Optional repo variables: YT_PLAYLIST_ID_SHORTS (playlist for Shorts),
      # YT_PRIVACY_SHORTS (public | unlisted | private; default public).
      - name: Build English Short
        id: build_short_en
        if: vars.ENABLE_VIDEO == 'true' && vars.ENABLE_SHORTS == 'true' && steps.background.outcome == 'success'
        continue-on-error: true
        run: |
          MMDD=$(date +'%m-%d')
          YEAR=$(date +'%Y')
          BACKGROUND_VIDEO=/tmp/background.mp4 python build_short.py $MMDD $YEAR

      - name: Upload English Short to YouTube
        id: upload_short_en
        if: vars.ENABLE_VIDEO == 'true' && vars.ENABLE_SHORTS == 'true' && steps.build_short_en.outcome == 'success'
        continue-on-error: true
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          VOR_FORMAT: short
          YT_PLAYLIST_ID_SHORTS: ${{ vars.YT_PLAYLIST_ID_SHORTS }}
          YT_PRIVACY_SHORTS: ${{ vars.YT_PRIVACY_SHORTS || 'public' }}
        run: |
          python upload_youtube.py

      - name: Notify — English Short skipped or failed
        if: |
          vars.ENABLE_VIDEO == 'true' && vars.ENABLE_SHORTS == 'true' &&
          (steps.build_short_en.outcome == 'failure' || steps.upload_short_en.outcome == 'failure')
        run: |
          if [ -f /tmp/short_warning.txt ]; then
            TITLE="VoR Warning: Short skipped"
            MSG=$(cat /tmp/short_warning.txt)
          else
            STAGE="build"
            if [ "${{ steps.build_short_en.outcome }}" == "success" ]; then STAGE="upload"; fi
            TITLE="VoR FAILURE: English Short ${STAGE}"
            MSG="English Short ${STAGE} failed on $(date +'%m-%d'). Check GitHub Actions logs."
          fi
          curl -s \
            --form-string "token=${{ secrets.PUSHOVER_APP_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER_KEY }}" \
            --form-string "title=${TITLE}" \
            --form-string "message=${MSG}" \
            --form-string "priority=0" \
            https://api.pushover.net/1/messages.json

      # ── Step 5: Translate, build, and upload Spanish video ───────────────────
      - name: Translate meditation to Spanish
        id: translate_es
        if: vars.ENABLE_VIDEO == 'true' && vars.ENABLE_SPANISH == 'true' && steps.background.outcome == 'success'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MMDD=$(date +'%m-%d')
          python translate_meditation.py --date $MMDD

      - name: Notify — Spanish translation failure
        if: vars.ENABLE_VIDEO == 'true' && vars.ENABLE_SPANISH == 'true' && steps.translate_es.outcome == 'failure'
        run: |
          curl -s \
            --form-string "token=${{ secrets.PUSHOVER_APP_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER_KEY }}" \
            --form-string "title=VoR FAILURE: Spanish translation" \
            --form-string "message=Spanish translation failed on $(date +'%m-%d'). No Spanish video today. Check GitHub Actions logs." \
            --form-string "priority=0" \
            https://api.pushover.net/1/messages.json

      - name: Build Spanish video
        id: build_es
        if: vars.ENABLE_VIDEO == 'true' && vars.ENABLE_SPANISH == 'true' && steps.translate_es.outcome == 'success'
        continue-on-error: true
        run: |
          chmod +x build-video.sh
          MMDD=$(date +'%m-%d')
          YEAR=$(date +'%Y')
          VOR_LANG=es BACKGROUND_VIDEO=/tmp/background.mp4 ./build-video.sh $MMDD $YEAR

      - name: Upload Spanish video to YouTube
        id: upload_es
        if: vars.ENABLE_VIDEO == 'true' && vars.ENABLE_SPANISH == 'true' && steps.build_es.outcome == 'success'
        continue-on-error: true
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_PLAYLIST_ID_ES: PL8OsToLnGRr9Ll4Sa-gog1q4_Tucx34KP
        run: |
          VOR_LANG=es python upload_youtube.py

      - name: Notify — Spanish build or upload failure
        if: |
          vars.ENABLE_VIDEO == 'true' && vars.ENABLE_SPANISH == 'true' &&
          (steps.build_es.outcome == 'failure' || steps.upload_es.outcome == 'failure')
        run: |
          STAGE="build"
          if [ "${{ steps.build_es.outcome }}" == "success" ]; then STAGE="upload"; fi
          curl -s \
            --form-string "token=${{ secrets.PUSHOVER_APP_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER_KEY }}" \
            --form-string "title=VoR FAILURE: Spanish video ${STAGE}" \
            --form-string "message=Spanish video ${STAGE} failed on $(date +'%m-%d'). Check GitHub Actions logs." \
            --form-string "priority=0" \
            https://api.pushover.net/1/messages.json

      # ── Step 5b: X post with the Short as native video ───────────────────────
      # Only when repo variable X_VIDEO == 'true' (Step 1 then defers X).
      # Posts the Short if it exists and is <= 2:20 (X's non-Premium limit);
      # otherwise, or if Buffer reports the video failed, posts the usual
      # image. The MP4 is hosted on the rolling 'x-media' GitHub release
      # because Buffer only takes media by URL. Acts only when MM-DD.posted
      # says "x_twitter: deferred", so re-runs never double-post.
      - name: Post to X (Short video, image fallback)
        id: x_video
        if: always() && vars.X_VIDEO == 'true'
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python post_x_video.py $(date +'%m-%d')

      - name: Notify — X post failure
        if: always() && vars.X_VIDEO == 'true' && steps.x_video.outcome == 'failure'
        run: |
          curl -s \
            --form-string "token=${{ secrets.PUSHOVER_APP_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER_KEY }}" \
            --form-string "title=VoR FAILURE: X post" \
            --form-string "message=X post (video and image fallback) failed on $(date +'%m-%d'). Check GitHub Actions logs." \
            --form-string "priority=0" \
            https://api.pushover.net/1/messages.json

      # ── Step 6: Commit new files to repo ─────────────────────────────────────
      #
      # Always runs via if: always(). Commits meditation text, .posted flag
      # files (duplicate guard), and .vor-state.json (voice/video rotation).
      #
      # Key principle: any file written during the run that needs to survive
      # the git checkout -- . cleanup must be saved to /tmp first and
      # restored afterward. We do this for both .vor-state.json and the
      # daily .posted file.
      #
      - name: Commit and push new files
        id: commit
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          MMDD=$(date +'%m-%d')

          # Save run-generated files to /tmp before git checkout wipes them.
          # git checkout -- . is needed to clean the working tree for rebase,
          # but it discards any unstaged files written during the run.
          if [ -f .vor-state.json ]; then
            cp .vor-state.json /tmp/vor-state-run.json
            echo "Saved run state: $(cat /tmp/vor-state-run.json)"
          fi
          if [ -f "meditations/${MMDD}.posted" ]; then
            cp "meditations/${MMDD}.posted" /tmp/posted-run.txt
            echo "Saved .posted file for ${MMDD}"
          fi

          # Clean working tree so rebase has nothing to complain about,
          # then pull remote.
          git checkout -- . || true
          git pull --rebase

          # Restore run-generated files on top of the pulled remote state.
          if [ -f /tmp/vor-state-run.json ]; then
            cp /tmp/vor-state-run.json .vor-state.json
            echo "Restored run state"
          fi
          if [ -f /tmp/posted-run.txt ]; then
            cp /tmp/posted-run.txt "meditations/${MMDD}.posted"
            echo "Restored .posted file for ${MMDD}"
          fi

          git add meditations/*.txt meditations/*.posted
          [ -f .vor-state.json ] && git add -f .vor-state.json && echo "Added .vor-state.json" || echo "No .vor-state.json to commit (video disabled)"
          if git diff --staged --quiet; then
            echo "No new files to commit"
          else
            git commit -m "Daily meditation $(date +'%m-%d')"
            git fetch origin main
            git checkout -- . || true
            git rebase origin/main || git rebase --skip
            git push origin main
          fi

      - name: Notify — commit step failed
        if: always() && steps.commit.outcome == 'failure'
        run: |
          curl -s \
            --form-string "token=${{ secrets.PUSHOVER_APP_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER_KEY }}" \
            --form-string "title=VoR FAILURE: Git commit" \
            --form-string "message=Git commit/push failed on $(date +'%m-%d'). Meditation files may not be saved to repo." \
            --form-string "priority=0" \
            https://api.pushover.net/1/messages.json

      # ── Step 7: Success notification ─────────────────────────────────────────
      #
      # Fires only when the social step and commit step both succeeded AND no
      # video/Spanish failures occurred. If any step failed, we already sent
      # a failure Pushover above — so the success notification is suppressed
      # to avoid a confusing "all good" ping after a failure alert.
      #
      - name: Notify — success
        if: |
          always() &&
          steps.social.outcome != 'failure' &&
          steps.commit.outcome == 'success' &&
          steps.background.outcome != 'failure' &&
          steps.build_en.outcome != 'failure' &&
          steps.upload_en.outcome != 'failure' &&
          steps.build_short_en.outcome != 'failure' &&
          steps.upload_short_en.outcome != 'failure' &&
          steps.x_video.outcome != 'failure' &&
          steps.translate_es.outcome != 'failure' &&
          steps.build_es.outcome != 'failure' &&
          steps.upload_es.outcome != 'failure'
        run: |
          curl -s \
            --form-string "token=${{ secrets.PUSHOVER_APP_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER_KEY }}" \
            --form-string "title=VoR ✓ Daily run complete" \
            --form-string "message=Meditation posted $(date +'%m-%d'). Social posts and video done." \
            --form-string "priority=-1" \
            https://api.pushover.net/1/messages.json
